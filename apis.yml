aid: kantox
name: Kantox
description: 'Kantox is a foreign-exchange (FX) risk management and Currency Management
  Automation software company, headquartered in London and Barcelona and part of BNP
  Paribas. Its flagship platform, Kantox Dynamic Hedging, automates the full pre-trade,
  trade and post-trade FX workflow — exposure collection, rules-based hedge execution,
  dynamic pricing with live mid-market rates across 130+ currencies, and end-to-end
  reporting. Companies connect their ERP, TMS or trading systems (SAP, Oracle, Microsoft
  Dynamics, NetSuite, 360T, FXall) to Kantox through a REST API or SFTP, using API
  calls and webhooks to submit forecasts, orders and invoices and to receive real-time
  FX and pricing updates. Kantox is authorised by the UK Financial Conduct Authority
  (FCA) and regulated by the Bank of Spain.'
